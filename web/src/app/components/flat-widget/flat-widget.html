<ion-card class="flat-widget">
    <ion-card-header>
      <ion-card-title>{{ data.type }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
        @for( entry of data.data; track entry.key) {
            <p>{{ entry.key }}: {{ entry.value }}</p>
        }
    </ion-card-content>
</ion-card>
